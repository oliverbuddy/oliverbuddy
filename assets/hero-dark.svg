<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="320" viewBox="0 0 1120 320" fill="none" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">oliverbuddy — profile banner</title>
  <desc id="heroDesc">深色科技感横幅，青蓝到紫色渐变、细网格与轨道节点。</desc>

  <defs>
    <linearGradient id="frameStroke" x1="0" y1="0" x2="1120" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#8B5CF6" stop-opacity=".28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="64" y1="76" x2="560" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2FDFF"/>
      <stop offset=".42" stop-color="#5EE7F5"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="784" y1="40" x2="1008" y2="264" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".9"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity=".5"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".18"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity=".12"/>
    </linearGradient>
    <radialGradient id="glowCyan">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity=".26"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#9FB4D0" stroke-opacity=".085" stroke-width="1"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#9FB4D0" fill-opacity=".04"/>
    </pattern>
    <filter id="softGlow" x="-15%" y="-60%" width="130%" height="220%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="frame">
      <rect width="1120" height="320" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1120" height="320" fill="#05070C"/>
    <circle cx="40" cy="0" r="330" fill="url(#glowCyan)"/>
    <circle cx="1090" cy="330" r="340" fill="url(#glowViolet)"/>
    <rect width="1120" height="320" fill="url(#grid)"/>
    <rect width="1120" height="320" fill="url(#scan)"/>
    <ellipse cx="560" cy="322" rx="520" ry="90" fill="#22D3EE" fill-opacity=".05"/>
    <path d="M0 300H1120" stroke="#22D3EE" stroke-opacity=".1"/>

    <!-- 右侧轨道图形 -->
    <g>
      <path d="M896 40A112 112 0 0 1 1008 152" stroke="url(#arcGrad)" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M896 264A112 112 0 0 1 784 152" stroke="#22D3EE" stroke-opacity=".18" stroke-width="1"/>
      <circle cx="896" cy="152" r="112" stroke="#8B5CF6" stroke-opacity=".2"/>
      <circle cx="896" cy="152" r="82" stroke="#22D3EE" stroke-opacity=".3" stroke-dasharray="2 7"/>
      <circle cx="896" cy="152" r="52" stroke="#9FB4D0" stroke-opacity=".22"/>
      <path d="M756 152H1036" stroke="#9FB4D0" stroke-opacity=".08" stroke-dasharray="1 9"/>
      <path d="M896 12V244" stroke="#9FB4D0" stroke-opacity=".08" stroke-dasharray="1 9"/>
      <circle cx="896" cy="40" r="8" fill="#22D3EE" fill-opacity=".16"/>
      <circle cx="896" cy="40" r="3.4" fill="#5EE7F5"/>
      <circle cx="978" cy="108" r="7" fill="#8B5CF6" fill-opacity=".18"/>
      <circle cx="978" cy="108" r="2.8" fill="#A78BFA"/>
      <circle cx="840" cy="216" r="2.4" fill="#7C8CA6"/>
      <rect x="1032" y="196" width="6" height="6" fill="none" stroke="#22D3EE" stroke-opacity=".6" transform="rotate(45 1035 199)"/>
      <rect x="812" y="58" width="4" height="4" fill="#8B5CF6" fill-opacity=".55"/>
      <path d="M1008 152h28M784 152h-28M896 40V16M896 264v-24" stroke="#22D3EE" stroke-opacity=".22"/>
    </g>

    <!-- 四角装饰 -->
    <g stroke="#22D3EE" stroke-opacity=".45" stroke-width="2" fill="none">
      <path d="M22 50V22h28"/>
      <path d="M1098 50V22h-28"/>
      <path d="M22 270v28h28"/>
      <path d="M1098 270v28h-28"/>
    </g>

    <!-- 顶部标识 -->
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">
      <circle cx="70" cy="46" r="6.5" fill="none" stroke="#22D3EE" stroke-opacity=".35"/>
      <circle cx="70" cy="46" r="2.8" fill="#5EE7F5"/>
      <text x="86" y="50" font-size="11" letter-spacing="3" fill="#7C8CA6">GITHUB / PROFILE</text>
      <text x="1056" y="50" font-size="10" letter-spacing="1.6" fill="#4C5A72" text-anchor="end">v2026.11</text>
    </g>

    <!-- 主标题 -->
    <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700">
      <text x="64" y="124" font-size="60" letter-spacing="2.4" fill="#22D3EE" fill-opacity=".35" filter="url(#softGlow)">OLIVERBUDDY</text>
      <text x="64" y="124" font-size="60" letter-spacing="2.4" fill="url(#titleGrad)">OLIVERBUDDY</text>
    </g>

    <!-- 副标题 -->
    <text x="66" y="162" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="15" letter-spacing=".8" fill="#9FB0C8">独立开发者 · 移动工具 / 本地加密 / 行情组件</text>

    <!-- 技术标签 -->
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10" letter-spacing="1">
      <g fill="#B9D7E4" fill-opacity=".88">
        <rect x="64" y="190" width="72" height="26" rx="6" fill="url(#chipGrad)" stroke="#22D3EE" stroke-opacity=".28"/>
        <text x="76" y="207">FLUTTER</text>
        <rect x="144" y="190" width="51" height="26" rx="6" fill="url(#chipGrad)" stroke="#22D3EE" stroke-opacity=".28"/>
        <text x="156" y="207">DART</text>
        <rect x="203" y="190" width="44" height="26" rx="6" fill="url(#chipGrad)" stroke="#22D3EE" stroke-opacity=".28"/>
        <text x="215" y="207">C++</text>
        <rect x="255" y="190" width="65" height="26" rx="6" fill="url(#chipGrad)" stroke="#22D3EE" stroke-opacity=".28"/>
        <text x="267" y="207">PYTHON</text>
        <rect x="328" y="190" width="93" height="26" rx="6" fill="url(#chipGrad)" stroke="#22D3EE" stroke-opacity=".28"/>
        <text x="340" y="207">JAVASCRIPT</text>
        <rect x="429" y="190" width="44" height="26" rx="6" fill="url(#chipGrad)" stroke="#22D3EE" stroke-opacity=".28"/>
        <text x="441" y="207">GIT</text>
        <rect x="481" y="190" width="65" height="26" rx="6" fill="url(#chipGrad)" stroke="#22D3EE" stroke-opacity=".28"/>
        <text x="493" y="207">DOCKER</text>
        <rect x="554" y="190" width="93" height="26" rx="6" fill="url(#chipGrad)" stroke="#22D3EE" stroke-opacity=".28"/>
        <text x="566" y="207">KUBERNETES</text>
      </g>
    </g>

    <!-- 底部信息 -->
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing=".8">
      <text x="64" y="262" fill="#7C8CA6">SIGNAL</text>
      <text x="118" y="262" fill="#AFC3D8">qiwei0727@163.com</text>
      <text x="536" y="262" fill="#55657C" text-anchor="end">github.com/oliverbuddy</text>
    </g>

    <!-- 底部刻度 -->
    <g stroke="#9FB4D0" stroke-opacity=".14">
      <path d="M64 288v6M104 288v4M144 288v4M184 288v6M224 288v4M264 288v4M304 288v6M344 288v4M384 288v4M424 288v6M464 288v4M504 288v4M544 288v6M584 288v4M624 288v4M664 288v6M704 288v4M744 288v4M784 288v6M824 288v4M864 288v4M904 288v6M944 288v4M984 288v4M1024 288v6"/>
    </g>
  </g>

  <rect x=".5" y=".5" width="1119" height="319" rx="18" fill="none" stroke="url(#frameStroke)"/>
  <rect x="1.5" y="1.5" width="1117" height="317" rx="16.5" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
</svg>
